<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Párrafo Segundo</title>
    <!-- Fuente de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <!-- Navegación -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">📚 Párrafo Segundo</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html" style="color: var(--accent-color); font-weight: 600;">Catálogo</a></li>
                <li><a href="novedades.html">Novedades</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito 🛒 <span id="contador-carrito" class="badge-carrito">0</span></a></li>
            </ul>
            <div class="search-nav">
                <input type="text" id="buscador-global" placeholder="Buscar libro..." class="search-input">
            </div>
        </div>
    </header>

    <!-- Encabezado de la página -->
    <header class="page-header azul">
        <h1>Catálogo Completo</h1>
        <p>Encuentra tu próximo libro favorito entre nuestra selección.</p>
    </header>

    <!-- Contenido del Catálogo -->
    <main class="container">
        
        <!-- Botones de Filtro -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="todos">Todos</button>
            <button class="filter-btn" data-filter="asiaticos">Asiáticos</button> 
            <button class="filter-btn" data-filter="clasicos">Clásicos</button>
            <button class="filter-btn" data-filter="contemporaneos">Contemporáneos</button>
            <button class="filter-btn" data-filter="latinoamericanos">Latinoamericanos</button>
        </div>
        
        <!-- CONTENEDOR VACÍO: Aquí JavaScript inyectará las tarjetas de los libros automáticamente -->
        <div class="book-grid">
            
        </div>
        
    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 Librería - Párrafo Segundo. Todos los derechos reservados.</p>
    </footer>


    <script src="../js/toasts.js"></script>
    <script src="../js/libros.js"></script>
    <script src="../js/carrito.js?v=1"></script>

</body>
</html>
